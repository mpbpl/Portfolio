<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio CAD 3D</title>
<style>
:root{
  --bg:#0d0e0f;
  --panel:#15171a;
  --border:#2b2f33;
  --text:#d8dbdd;
  --muted:#8c9297;
  --green:#0f4d34;
  --green-hi:#1a6b49;
  --green-lo:#0a3524;
  --accent:#c4a032;
  --font:ui-monospace,"Cascadia Code","SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--text);
  line-height:1.6;
  font-size:15px;
  padding:2rem 1rem 3rem;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.container{max-width:1040px;margin:0 auto}

/* Naglowek jako tabliczka rysunkowa */
.titleblock{
  border:1px solid var(--border);
  background:var(--panel);
  margin-bottom:2.5rem;
  position:relative;
}
.titleblock::before{
  content:"";
  position:absolute;left:0;top:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--green-lo),var(--green-hi) 45%,var(--green) 70%,var(--green-lo));
}
.tb-top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem;
  padding:1.75rem 1.5rem 1.5rem;
}
h1{font-size:1.7rem;line-height:1.25;margin-bottom:.6rem;font-weight:700}
.subtitle{color:var(--muted);max-width:64ch}
.lang{display:flex;border:1px solid var(--border);flex:none}
.lang button{
  font:inherit;font-size:.85rem;background:transparent;color:var(--muted);
  border:0;padding:.3rem .8rem;cursor:pointer;
}
.lang button+button{border-left:1px solid var(--border)}
.lang button[aria-pressed="true"]{background:var(--green);color:var(--text)}
.lang button:hover{color:var(--accent)}

/* Kafelki linkow */
.links{
  list-style:none;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;
  padding:1.25rem 1.5rem 1.5rem;border-top:1px solid var(--border);
}
.tile{
  display:flex;align-items:center;gap:.9rem;height:100%;
  text-decoration:none;padding:.9rem 1rem;
  border:1px solid var(--green-hi);
  background:linear-gradient(135deg,var(--green-lo),var(--green) 70%,var(--green-hi));
  transition:border-color .15s;
}
.tile:hover{border-color:var(--accent)}
.tile:hover strong{color:var(--accent)}
.tile .icon{flex:none;width:32px;height:32px;color:var(--accent)}
.tile .icon svg{width:100%;height:100%;display:block}
.tile strong{display:block;font-size:.95rem;line-height:1.3;transition:color .15s}
.tile small{display:block;font-size:.8rem;line-height:1.35;color:#b9c2bd;overflow-wrap:anywhere}

/* Sekcja projektow */
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--border);padding-bottom:.5rem;margin-bottom:1.5rem;
}
.section-head h2{font-size:1.1rem;font-weight:600}
.section-head .count{color:var(--muted);font-size:.85rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:2px;
  display:flex;flex-direction:column;position:relative;
}
.card.featured{border-color:var(--accent)}
.badge{
  position:absolute;top:.6rem;left:.6rem;z-index:1;
  background:var(--accent);color:#14110a;font-size:.75rem;font-weight:700;
  padding:.1rem .5rem;
}
.thumb{
  aspect-ratio:16/9;border-bottom:1px solid var(--border);background:#0b0c0d;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.empty{
  color:var(--muted);font-size:.85rem;
  background-image:
    linear-gradient(rgba(26,107,73,.25) 1px,transparent 1px),
    linear-gradient(90deg,rgba(26,107,73,.25) 1px,transparent 1px);
  background-size:20px 20px;
}
.body{padding:1.1rem 1.1rem 0;flex-grow:1}
.tag{color:var(--accent);font-size:.85rem;margin-bottom:.35rem}
.card h3{font-size:1.1rem;line-height:1.35;margin-bottom:.5rem}
.card p{color:var(--muted);font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;padding:1.1rem}
.btn{
  text-decoration:none;font-size:.85rem;font-weight:600;
  padding:.4rem .85rem;border:1px solid var(--green-hi);
  background:linear-gradient(135deg,var(--green-lo),var(--green) 60%,var(--green-hi));
  color:var(--text);transition:border-color .15s,color .15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
/* Formularz kontaktowy */
#contact{margin-top:3rem;scroll-margin-top:1rem}
.cform{max-width:640px;display:grid;gap:1rem}
.cform label{display:grid;gap:.35rem;font-size:.85rem;color:var(--muted)}
.cform input:not([type=hidden]):not([type=checkbox]),.cform textarea{
  font:inherit;font-size:.95rem;color:var(--text);background:#0b0c0d;
  border:1px solid var(--border);border-radius:0;padding:.6rem .7rem;width:100%;
}
.cform input:focus,.cform textarea:focus{border-color:var(--green-hi)}
.cform textarea{min-height:8rem;resize:vertical}
.cform .hp{display:none}
.cform .btn{justify-self:start;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.cform .btn:disabled{opacity:.6;cursor:wait}
#status{font-size:.85rem;min-height:1.4em}
#status.ok{color:#5fbf8f}
#status.err{color:#e0816b}
footer{margin-top:3rem;color:var(--muted);font-size:.8rem;text-align:center}

@media (max-width:720px){
  .tb-top{flex-direction:column-reverse;gap:1rem}
  .links{grid-template-columns:1fr}
  h1{font-size:1.4rem}
}
</style>
</head>
<body>
<div class="container">
  <header class="titleblock">
    <div class="tb-top">
      <div class="tb-main">
        <h1 id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <div class="lang" role="group" aria-label="Language / Język">
        <button type="button" data-lang="pl" aria-pressed="true">PL</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <ul class="links" id="links"></ul>
  </header>

  <main>
    <div class="section-head">
      <h2 id="projects-title"></h2>
      <span class="count" id="projects-count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <section id="contact">
    <div class="section-head"><h2 id="contact-title"></h2></div>
    <form id="cform" class="cform" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" id="akey">
      <input type="hidden" name="subject" value="Portfolio – nowa wiadomość">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label><span id="l-name"></span><input type="text" name="name" required maxlength="100" autocomplete="name"></label>
      <label><span id="l-email"></span><input type="email" name="email" required maxlength="200" autocomplete="email"></label>
      <label><span id="l-message"></span><textarea name="message" required maxlength="3000"></textarea></label>
      <button class="btn" type="submit" id="send"></button>
      <p id="status" role="status"></p>
    </form>
  </section>

  <footer id="footer"></footer>
</div>

<script>
/* ===== KONFIGURACJA: edytuj tylko ten blok ===== */
const SITE = {
  name: "Marek",
  brand: "MPBpl",
  web3formsKey: "8990ccd5-a9a3-4411-83fd-0eac7dd9eb82",  // publiczny z założenia; adres docelowy ustawiony w Web3Forms
  links: {
    github:     "https://github.com/mpbpl",
    grabcad:    "https://grabcad.com/marek-169/models",
    makerworld: "https://makerworld.com/@twoj-nick"
  }
};

const UI = {
  pl: {
    pageTitle: "Portfolio CAD 3D",
    hello: "Cześć, tu ",
    subtitle: "Moje portfolio projektów zrealizowanych we współpracy z asystentami AI. Aplikacje, strony, modele 3D CAD, automatyzacje procesów. W znacznej większości projekty oparte są o licencje MIT.",
    contact: "Kontakt",
    form: { name: "Imię", email: "Twój e-mail", message: "Wiadomość", send: "Wyślij", sending: "Wysyłanie…", ok: "Wysłano. Dziękuję!", err: "Nie udało się wysłać. Spróbuj ponownie później." },
    projects: "Projekty",
    featured: "wyróżnione",
    demo: "Link",
    noImage: "brak podglądu",
    count: n => n + " poz.",
    profiles: { github: "kod i dokumentacja", grabcad: "modele CAD", makerworld: "druk 3D" }
  },
  en: {
    pageTitle: "3D CAD Portfolio",
    hello: "Hi, I'm ",
    subtitle: "My portfolio of projects built in collaboration with AI assistants. Apps, websites, 3D CAD models, process automation. The vast majority of projects are released under the MIT license.",
    contact: "Contact",
    form: { name: "Name", email: "Your e-mail", message: "Message", send: "Send", sending: "Sending…", ok: "Sent. Thank you!", err: "Could not send. Please try again later." },
    projects: "Projects",
    featured: "featured",
    demo: "Link",
    noImage: "no preview",
    count: n => n + (n === 1 ? " item" : " items"),
    profiles: { github: "code and docs", grabcad: "CAD models", makerworld: "3D printing" }
  }
};

/* featured: true = żółta ramka i znacznik. Puste "" w links = przycisk się nie pokaże.
   image: ścieżka do pliku, np. "img/projekt1.jpg"; puste = zaślepka. */
const PROJECTS = [
  {
    featured: true,
    tag:   { pl: "Aplikacja webowa / mapa pogodowa", en: "Web app / weather map" },
    title: { pl: "Ponad chmurami – Dolny Śląsk (południe)", en: "Above the Clouds – Lower Silesia (south)" },
    desc:  { pl: "Interaktywna mapa w jednym pliku HTML: pokazuje, gdzie teren wznosi się ponad warstwę chmur („morze chmur”), a także mgłę i szczyty, na najbliższe 48 godzin. Południe Dolnego Śląska i czeskie Sudety. Dane: Open-Meteo (DWD ICON-D2).",
             en: "Interactive single-file map showing where terrain rises above the cloud layer (the “sea of clouds” view), plus fog and peaks, for the next 48 hours. Southern Lower Silesia and the Czech Sudetes. Data: Open-Meteo (DWD ICON-D2)." },
    image: "img/chmury.jpg",
    links: { demo: "https://mpbpl.github.io/Above-The-Clouds-Lower-Silesia/", github: "https://github.com/mpbpl/Above-The-Clouds-Lower-Silesia", grabcad: "", makerworld: "" }
  },
  {
    featured: false,
    tag:   { pl: "Kategoria / narzędzie", en: "Category / tool" },
    title: { pl: "Projekt 2 – tytuł", en: "Project 2 – title" },
    desc:  { pl: "Krótki opis projektu.", en: "Short project description." },
    image: "",
    links: { github: "", grabcad: "https://grabcad.com/twoj-nick", makerworld: "" }
  },
  {
    featured: false,
    tag:   { pl: "Kategoria / narzędzie", en: "Category / tool" },
    title: { pl: "Projekt 3 – tytuł", en: "Project 3 – title" },
    desc:  { pl: "Krótki opis projektu.", en: "Short project description." },
    image: "",
    links: { github: "https://github.com/twoj-nick/projekt-3", grabcad: "", makerworld: "https://makerworld.com/@twoj-nick" }
  },
  {
    featured: false,
    tag:   { pl: "Kategoria / narzędzie", en: "Category / tool" },
    title: { pl: "Projekt 4 – tytuł", en: "Project 4 – title" },
    desc:  { pl: "Krótki opis projektu.", en: "Short project description." },
    image: "",
    links: { github: "https://github.com/twoj-nick/projekt-4", grabcad: "", makerworld: "" }
  }
];
/* ===== KONIEC KONFIGURACJI ===== */

const ICONS = {
  github:     '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/>',
  grabcad:    '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
  makerworld: '<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>',
  mail:       '<rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/>'
};

function icon(key) {
  const w = el("span", "icon");
  w.setAttribute("aria-hidden", "true");
  w.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter">' + ICONS[key] + '</svg>';
  return w;
}

function tile(href, key, name, desc) {
  const li = el("li");
  const a = link(href, null, "tile");
  a.appendChild(icon(key));
  const txt = el("span");
  txt.appendChild(el("strong", null, name));
  if (desc) txt.appendChild(el("small", null, desc));
  a.appendChild(txt);
  li.appendChild(a);
  return li;
}

const LABELS = { github: "GitHub", grabcad: "GrabCAD", makerworld: "MakerWorld" };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function link(href, text, cls) {
  const a = el("a", cls, text || undefined);
  a.href = href;
  if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
  return a;
}

function getLang() {
  try {
    const s = localStorage.getItem("lang");
    if (s === "pl" || s === "en") return s;
  } catch (e) {}
  return (navigator.language || "pl").toLowerCase().startsWith("pl") ? "pl" : "en";
}

function render(lang) {
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.title = t.pageTitle;
  document.getElementById("title").textContent = t.hello + SITE.name;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("projects-title").textContent = t.projects;
  document.getElementById("projects-count").textContent = t.count(PROJECTS.length);
  document.getElementById("contact-title").textContent = t.contact;
  document.getElementById("l-name").textContent = t.form.name;
  document.getElementById("l-email").textContent = t.form.email;
  document.getElementById("l-message").textContent = t.form.message;
  document.getElementById("send").textContent = t.form.send;
  document.getElementById("akey").value = SITE.web3formsKey;
  document.getElementById("footer").textContent = "© 2026 " + SITE.brand;

  document.querySelectorAll(".lang button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  const links = document.getElementById("links");
  links.replaceChildren();
  Object.keys(LABELS).forEach(k => {
    if (SITE.links[k]) links.appendChild(tile(SITE.links[k], k, LABELS[k], t.profiles[k]));
  });
  links.appendChild(tile("#contact", "mail", t.contact));

  const grid = document.getElementById("grid");
  grid.replaceChildren();
  PROJECTS.forEach(p => {
    const card = el("article", "card" + (p.featured ? " featured" : ""));
    if (p.featured) card.appendChild(el("span", "badge", t.featured));

    let thumb;
    if (p.image) {
      thumb = el("div", "thumb");
      const img = el("img");
      img.src = p.image;
      img.alt = p.title[lang];
      img.loading = "lazy";
      thumb.appendChild(img);
    } else {
      thumb = el("div", "thumb empty", t.noImage);
    }
    card.appendChild(thumb);

    const body = el("div", "body");
    body.appendChild(el("div", "tag", p.tag[lang]));
    body.appendChild(el("h3", null, p.title[lang]));
    body.appendChild(el("p", null, p.desc[lang]));
    card.appendChild(body);

    const actions = el("div", "actions");
    if (p.links.demo) actions.appendChild(link(p.links.demo, t.demo, "btn"));
    Object.keys(LABELS).forEach(k => {
      if (p.links[k]) actions.appendChild(link(p.links[k], LABELS[k], "btn"));
    });
    card.appendChild(actions);

    grid.appendChild(card);
  });
}

document.querySelectorAll(".lang button").forEach(b =>
  b.addEventListener("click", () => {
    try { localStorage.setItem("lang", b.dataset.lang); } catch (e) {}
    render(b.dataset.lang);
  }));

document.getElementById("cform").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, btn = document.getElementById("send"), st = document.getElementById("status");
  const f = UI[document.documentElement.lang] || UI.pl;
  btn.disabled = true;
  st.className = ""; st.textContent = f.form.sending;
  try {
    const r = await fetch(form.action, { method: "POST", headers: { Accept: "application/json" }, body: new FormData(form) });
    const d = await r.json();
    if (d.success) { form.reset(); st.className = "ok"; st.textContent = f.form.ok; }
    else throw new Error(d.message || "error");
  } catch (err) {
    st.className = "err"; st.textContent = f.form.err;
  }
  btn.disabled = false;
});

render(getLang());
</script>
</body>
</html>
